# ไฟล์คอนฟิกสำหรับสร้างคลัสเตอร์ 3 Nodes ด้วย Kind
# รันด้วยคำสั่ง: kind create cluster --name k8s-lab --config kind-3node-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # เปิดพอร์ต NodePort 30080-30085 ให้เข้าจาก localhost บนเครื่อง Windows/Mac ได้ทันที
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
      - containerPort: 30082
        hostPort: 30082
        protocol: TCP
      - containerPort: 30083
        hostPort: 30083
        protocol: TCP
      - containerPort: 30084
        hostPort: 30084
        protocol: TCP
      - containerPort: 30085
        hostPort: 30085
        protocol: TCP
  - role: worker
  - role: worker
