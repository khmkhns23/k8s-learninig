apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws02-webapp
  namespace: k8s-lab
  labels:
    app: ws02-web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ws02-web
  template:
    metadata:
      labels:
        app: ws02-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
