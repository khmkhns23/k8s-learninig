# เคสที่ 4: ทำไม Pod รีสตาร์ทซ้ำๆ หรือไม่ยอม Ready สักที?
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case04-probe
  namespace: k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: case04
  template:
    metadata:
      labels:
        app: case04
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /non-existent-healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /non-existent-ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
