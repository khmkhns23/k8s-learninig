# เคสที่ 3: ทำไม Pod ค้างสถานะ Pending ตลอดเวลา?
apiVersion: apps/v1
kind: Deployment
metadata:
  name: case03-heavy
  namespace: k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: case03
  template:
    metadata:
      labels:
        app: case03
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: "100m"
              memory: "16Gi"
            limits:
              cpu: "200m"
              memory: "16Gi"
