# ==========================================================
# Tier 1: Backend (Internal Only - ClusterIP)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
  namespace: k8s-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ws03-backend
  template:
    metadata:
      labels:
        app: ws03-backend
    spec:
      containers:
        - name: backend
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: k8s-lab
spec:
  type: ClusterIP
  selector:
    app: ws03-backend
  ports:
    - port: 80
      targetPort: 80
---
# ==========================================================
# Tier 2: Frontend (Exposed externally via NodePort 30081)
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
  namespace: k8s-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ws03-frontend
  template:
    metadata:
      labels:
        app: ws03-frontend
    spec:
      containers:
        - name: frontend
          image: httpd:2.4-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: k8s-lab
spec:
  type: NodePort
  selector:
    app: ws03-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
