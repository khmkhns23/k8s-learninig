# 1. ConfigMap เก็บทั้งค่า Env และไฟล์ index.html
apiVersion: v1
kind: ConfigMap
metadata:
  name: ws04-config
  namespace: k8s-lab
data:
  APP_ENV: "staging"
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>K8s ConfigMap Lab</title></head>
    <body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
      <h1>Hello from ConfigMap!</h1>
      <p>Version 1 - Configured without rebuilding image</p>
    </body>
    </html>
---
# 2. Secret เก็บข้อมูลลับ (ใช้ stringData เพื่อให้เขียนข้อความปกติได้)
apiVersion: v1
kind: Secret
metadata:
  name: ws04-secret
  namespace: k8s-lab
type: Opaque
stringData:
  DB_USER: "admin"
  DB_PASS: "P@ssw0rd1234"
---
# 3. Pod ที่ดึงทั้ง Env และ Mount ConfigMap เป็นไฟล์
apiVersion: v1
kind: Pod
metadata:
  name: ws04-app
  namespace: k8s-lab
  labels:
    app: ws04-app
spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
      env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: ws04-config
              key: APP_ENV
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: ws04-secret
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: ws04-secret
              key: DB_PASS
      volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
  volumes:
    - name: web-content
      configMap:
        name: ws04-config
---
apiVersion: v1
kind: Service
metadata:
  name: ws04-svc
  namespace: k8s-lab
spec:
  type: NodePort
  selector:
    app: ws04-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
